<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PennyWise — Free UK Money Calculators</title>
<meta name="description" content="Free calculators that help you keep more of your money. Salary, stamp duty, mortgage, VAT, budget, rental yield, and more." />
<style>
:root { --bg: #FAF7F2; --fg: #1C1A17; --accent: #C0512F; --card: #fff; --border: #E6E0D8; --muted: #8A817A; }
body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); line-height:1.6; }
main { max-width: 900px; margin:0 auto; padding: 40px 20px; }
h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 2.4rem; margin-bottom:.2rem; }
.subtitle { color: var(--muted); font-size:1.1rem; margin-bottom:2.5rem; }
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:20px; }
.card { background: var(--card); border:1px solid var(--border); border-radius:12px; padding:28px 24px; transition: box-shadow .2s; }
.card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.08); }
.card h3 { margin:0 0 .5rem; font-family: Georgia, serif; font-size:1.15rem; }
.card p { color:var(--muted); font-size:.9rem; margin:0 0 1rem; }
.card a { color:var(--accent); font-weight:600; text-decoration:none; }
@media (max-width: 600px) { main { padding: 24px 16px; } h1 { font-size: 1.8rem; } }
</style>
</head>
<body>
<main>
<h1>PennyWise</h1>
<p class="subtitle">Free UK calculators that help you keep more of your money. No sign-up, no ads, no nonsense.</p>
<div class="grid" id="tool-grid">
<!-- JS populated -->
</div>
</main>
<script>
const tools = [
  { name: "Salary Calculator", desc: "See your take-home pay after tax, NI, student loans, and pension — 2025/26 rates.", slug: "salary-calculator" },
  { name: "Stamp Duty Calculator", desc: "Calculate SDLT on any UK property — first-time buyer, BTL, second home, non-resident.", slug: "stamp-duty-calculator" },
  { name: "Mortgage Repayment Calculator", desc: "Monthly repayments, total interest, LTV, and overpayment savings.", slug: "mortgage-calculator" },
  { name: "VAT Calculator", desc: "Add or remove VAT at standard 20%, reduced 5%, zero 0%, or custom rate.", slug: "vat-calculator" },
  { name: "50/30/20 Budget Calculator", desc: "Split your take-home pay into Needs, Wants, and Savings with UK guidance.", slug: "budget-calculator" },
  { name: "Rental Yield Calculator", desc: "Gross yield, net yield, ROI, and tax for buy-to-let investments.", slug: "rental-yield-calculator" },
];
const grid = document.getElementById('tool-grid');
tools.forEach(t => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>${t.name}</h3><p>${t.desc}</p><a href="/pennywise/${t.slug}/">Try it →</a>`;
  grid.appendChild(card);
});
</script>
</body>
</html>
